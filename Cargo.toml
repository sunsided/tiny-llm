[package]
name = "tiny"
version = "0.1.0"
edition = "2024"
description = "TINY 2.1, a letter-by-letter question-answering transformer, with a neon terminal UI"
license = "MIT"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
cpal = "0.18"
rand = "0.10.4"
ratatui = "0.30.2"
synthie = { version = "0.8", default-features = false, features = ["std"] }
synthie-trombone = "0.2"
thiserror = "2.0.21"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
mod_module_files = "deny"

[profile.dev]
# Inference is a tight float loop; unoptimised it is ~30x slower.
opt-level = 2

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"

[[bench]]
name = "step"
harness = false
