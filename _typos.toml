# https://github.com/crate-ci/typos/blob/master/docs/reference.md
[files]
extend-exclude = [
  "*.lock",
  "fuzz/corpus/**",
  "fuzz/artifacts/**",
  "**/proptest-regressions/**",
  "LICENSES/**",
  "LICENSE-*",
  # Training data and the frozen test set: verbatim from the original kit, with deliberate typos.
  "crates/tiny-train/data/**",
  "crates/tiny-train/tests/fixtures/**",
]

[default.extend-words]
# Project-specific words typos flags wrongly, e.g. `ser = "ser"`. Keep each entry justified.
# The terminal UI crate this project uses.
ratatui = "ratatui"

[default.extend-identifiers]
