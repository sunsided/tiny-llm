[package]
name = "tiny-train"
version = "0.1.0"
description = "Training kit for TINY: question generator, burn trainer, evaluation and TINY.BIN export"
keywords = ["transformer", "llm", "training", "burn"]
categories = ["science"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
burn = { version = "0.22.1", default-features = false, features = ["std", "autodiff", "optim", "flex", "simd", "rayon"] }
clap = { version = "4.6.9", features = ["derive"] }
pytorch-reader = "0.22.1"
rand = "0.10"
safetensors = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny = { path = "../tiny" }

[features]
# Train on an NVIDIA GPU (needs the CUDA toolkit): `--features cuda`, then `train --device cuda`.
cuda = ["burn/cuda", "burn/fusion", "burn/autotune"]
# Train on any GPU through wgpu (Vulkan, Metal, DX12): `--features wgpu`, then `train --device wgpu`.
wgpu = ["burn/wgpu", "burn/fusion", "burn/autotune"]

[lints]
workspace = true
