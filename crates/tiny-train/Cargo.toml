[package]
name = "tiny-train"
version = "0.1.0"
description = "Training kit for TINY: question generator, candle trainer, evaluation and TINY.BIN export"
keywords = ["transformer", "llm", "training", "candle"]
categories = ["science"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11.1"
candle-nn = "0.11.1"
clap = { version = "4.6.9", features = ["derive"] }
rand = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny = { path = "../tiny" }
zip = { version = "9", default-features = false }

[features]
# Train on an NVIDIA GPU (needs the CUDA toolkit): `--features cuda`, then `train --device cuda`.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[lints]
workspace = true
